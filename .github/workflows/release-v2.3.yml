name: Build and publish NeoCam v2.3 APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v2.3.yml
      - app/build.gradle.kts
      - gradle.properties
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neocam-v2.3-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish APK
    runs-on: ubuntu-latest
    env:
      NEOCAM_STORE_PASSWORD: ${{ secrets.NEOCAM_STORE_PASSWORD }}
      NEOCAM_KEY_ALIAS: ${{ secrets.NEOCAM_KEY_ALIAS }}
      NEOCAM_KEY_PASSWORD: ${{ secrets.NEOCAM_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.NEOCAM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$NEOCAM_STORE_PASSWORD" && -n "$NEOCAM_KEY_ALIAS" && -n "$NEOCAM_KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neocam-release.jks"
            echo "NEOCAM_KEYSTORE_PATH=$RUNNER_TEMP/neocam-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No persistent signing key. The generated APK cannot update previous debug-signed builds in place."
          fi

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and rename APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" NeoCam-v2.3.apk
          sha256sum NeoCam-v2.3.apk | tee NeoCam-v2.3.apk.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeoCam-v2.3
          path: |
            NeoCam-v2.3.apk
            NeoCam-v2.3.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release v2.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          NeoCam v2.3 installable Android APK, built from the repository source with the Gradle `assembleRelease` task.

          **Signing note:** The project currently configures its release build to use the Android debug signing key. This APK is therefore **debug-key-signed**, not production-key-signed; installing updates from a different key may require uninstalling the previous app first.
          EOF
          if gh release view v2.3 >/dev/null 2>&1; then
            echo "::error::v2.3 already exists. Never silently replace published APK binaries."
            exit 1
          fi
          gh release create v2.3 NeoCam-v2.3.apk NeoCam-v2.3.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "NeoCam v2.3" \
            --notes-file release-notes.md \
            --latest
